    <script>
      // Defensive guard against browser extensions attempting to assign to read-only fetch getter
      try {
        let _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() { return _fetch; },
          set(v) { _fetch = v; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {}

      // Suppress benign iframe WebSocket HMR warnings
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (event.reason.message?.includes('WebSocket') || event.reason.toString().includes('WebSocket'))) {
          event.preventDefault();
        }
      });
    </script>

  </body>
